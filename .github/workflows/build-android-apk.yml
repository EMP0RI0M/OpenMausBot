name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android-apk.yml'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build OpenMausBot Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Make Gradle executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f apps/mobile/android/app/debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore apps/mobile/android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Find & Verify APK
        id: apk-find
        run: |
          echo "Listing generated APKs:"
          ls -la apps/mobile/android/app/build/outputs/apk/release/

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmausbot-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
